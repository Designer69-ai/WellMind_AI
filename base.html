<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WellMind AI - Health Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at top left, rgba(139, 92, 246, 0.15), transparent 50%),
                radial-gradient(ellipse at top right, rgba(59, 130, 246, 0.15), transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(236, 72, 153, 0.15), transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(168, 85, 247, 0.15), transparent 50%);
            animation: gradientShift 15s ease infinite;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            background: rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: float 20s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }
            33% {
                transform: translateY(-100px) translateX(50px);
            }
            66% {
                transform: translateY(-50px) translateX(-50px);
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            padding: 40px 50px;
            border-radius: 30px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        h1 {
            font-size: 3.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6, #ec4899);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 5s ease infinite;
            margin-bottom: 10px;
            position: relative;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .tagline {
            color: #94a3b8;
            font-size: 1.3em;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        nav {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 25px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            margin-bottom: 30px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            text-decoration: none;
            color: #e2e8f0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(59, 130, 246, 0.2));
            padding: 16px 32px;
            border-radius: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: block;
            font-weight: 600;
            border: 1px solid rgba(139, 92, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        nav a::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        nav a:hover::before {
            width: 300px;
            height: 300px;
        }

        nav a:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.4);
            border-color: rgba(139, 92, 246, 0.6);
        }

        nav a span {
            position: relative;
            z-index: 1;
        }

        .content {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            position: relative;
        }

        .content::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 30px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.5), rgba(59, 130, 246, 0.5), rgba(236, 72, 153, 0.5));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .content:hover::after {
            opacity: 1;
        }

        footer {
            text-align: center;
            color: #94a3b8;
            margin-top: 40px;
            padding: 30px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid rgba(139, 92, 246, 0.1);
        }

        footer p {
            font-weight: 500;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2em;
            }
            
            header, nav, .content {
                padding: 25px;
            }
            
            nav ul {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating particles -->
    <div class="particle" style="width: 300px; height: 300px; top: 10%; left: 5%; animation-delay: 0s;"></div>
    <div class="particle" style="width: 200px; height: 200px; top: 60%; right: 10%; animation-delay: 5s;"></div>
    <div class="particle" style="width: 250px; height: 250px; bottom: 10%; left: 50%; animation-delay: 10s;"></div>

    <div class="container">
        <header>
            <h1>🧠 WellMind AI</h1>
            <p class="tagline">An AI-powered Health Assistant for Everyone</p>
        </header>
        
        <nav>
            <ul>
                <li><a href="/"><span>🏡 Home</span></a></li>
                <li><a href="templates/medical_imaging.html"><span>🔬 Medical Imaging</span></a></li>
                <li><a href="templates/mental-health"><span>💭 Mental Health</span></a></li>
                <li><a href="templates/outbreak-prediction"><span>📊 Outbreak Prediction</span></a></li>
            </ul>
        </nav>

        <div class="content" id="main-content">
            <!-- Content will be inserted here -->
        </div>

        <footer>
            <p style="font-size: 1.1em; margin-bottom: 8px;">WellMind AI - Supporting UN SDG 3: Good Health and Well-being</p>
            <p style="font-size: 0.95em; opacity: 0.8;">Built with ❤️ using Python & Flask</p>
        </footer>
    </div>
</body>
</html>
